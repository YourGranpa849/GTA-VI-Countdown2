name: Build GTA VI Countdown IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ViceCityCountdown/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile iOS app
        run: xcodebuild -project ViceCityCountdown.xcodeproj -scheme ViceCityCountdown -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ViceCityCountdown.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/output/GTA-VI-Countdown-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-VI-Countdown-unsigned-IPA
          path: output/GTA-VI-Countdown-unsigned.ipa
